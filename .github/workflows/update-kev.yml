name: Refresh KEV feed and deploy

# The site is served from the gh-pages branch, so refreshing kev.json on main
# alone would never reach visitors. This fetches the catalog, commits the
# snapshot to main, then rebuilds and publishes to gh-pages so the ticker
# actually updates without anyone touching it.
#
# CISA publishes roughly weekly; this checks daily and exits early when the
# catalog has not changed, so it does not redeploy the site for nothing.

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kev-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fetch CISA KEV catalog
        run: node scripts/fetch-kev.mjs

      - name: Stop early if the catalog is unchanged
        id: diff
        run: |
          if git diff --quiet -- public/kev.json src/data/kev-fallback.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "KEV unchanged — skipping rebuild and deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the refreshed snapshot to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kev.json src/data/kev-fallback.json
          git commit -m "chore: refresh CISA KEV feed"
          git push

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Publish dist to gh-pages
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: KEV feed refresh"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
